name: Supabase migrations

# Aplica supabase/migrations/ contra el proyecto Supabase de producción al
# mergear a main. Requiere los secrets SUPABASE_ACCESS_TOKEN,
# SUPABASE_DB_PASSWORD y SUPABASE_PROJECT_REF en el repositorio; mientras no
# estén configurados, el job termina temprano sin fallar (ver el paso
# "Verificar secrets"), para no bloquear el resto de main antes de que el
# equipo tenga un proyecto Supabase real.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: {}

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar secrets
        id: secrets
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "listo=false" >> "$GITHUB_OUTPUT"
            echo "Faltan uno o más secrets (SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF)."
            echo "Se omite el push de migraciones; configúralos en Settings > Secrets del repositorio para activarlo."
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.listo == 'true'
        with:
          version: latest

      - name: supabase db push
        if: steps.secrets.outputs.listo == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase db push
