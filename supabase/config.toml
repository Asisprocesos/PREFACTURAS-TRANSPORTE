# Configuración de Supabase CLI para desarrollo local (Docker).
# Ver README.md, sección "Ejecución local", antes de correr `supabase start`.
project_id = "prefacturas-transporte"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = false

[storage]
enabled = true
file_size_limit = "50MiB"

[analytics]
enabled = false
